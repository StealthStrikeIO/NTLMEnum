[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntlmenum"
version = "1.0.0"
description = "NTLM authentication endpoint enumerator for penetration testing"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx[http2]>=0.27.0",
]

[project.scripts]
ntlmenum = "ntlmenum.cli:main"

[tool.setuptools.packages.find]
include = ["ntlmenum*"]
